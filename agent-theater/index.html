<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PinDeal · Agent room</title>
    <style>
      :root {
        --line: #06c755;
        --bubble: #fff;
        --ink: #111;
        --mind: #6b4f9a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif;
        background: #1c2129;
        color: var(--ink);
      }
      .stage {
        width: min(420px, 100vw);
        height: min(860px, 100vh);
        background: #74808a;
        display: flex;
        flex-direction: column;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      .note {
        padding: 10px 14px 8px;
        background: #111;
        color: #f3e6c8;
        font-size: 12px;
        line-height: 1.45;
      }
      .note b {
        color: #fff;
      }
      header {
        background: #8b9198;
        padding: 10px 12px 12px;
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 10px;
        align-items: center;
        color: #111;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
      }
      header p {
        margin: 2px 0 0;
        font-size: 11px;
        color: #2b3036;
      }
      .back {
        font-size: 22px;
        line-height: 1;
      }
      .thread {
        flex: 1;
        overflow: auto;
        padding: 12px 10px 20px;
        background: #8a969f;
      }
      .day {
        text-align: center;
        color: #eef1f4;
        font-size: 11px;
        margin: 8px 0 14px;
      }
      .sys {
        display: flex;
        justify-content: center;
        margin: 10px 0;
      }
      .sys span {
        max-width: 86%;
        background: rgba(0, 0, 0, 0.28);
        color: #fff;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 11px;
        text-align: center;
        line-height: 1.4;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        margin: 10px 0;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        flex: 0 0 auto;
      }
      .a {
        background: #1a73e8;
      }
      .b {
        background: #5ba3c9;
      }
      .c {
        background: #e07a3d;
      }
      .d {
        background: #3f8f6b;
      }
      .col {
        max-width: 78%;
      }
      .name {
        font-size: 11px;
        color: #eef1f4;
        margin: 0 0 4px 6px;
      }
      .bubble {
        background: var(--bubble);
        border-radius: 16px;
        padding: 8px 11px;
        font-size: 14px;
        line-height: 1.45;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
      }
      .bubble p {
        margin: 0 0 6px;
      }
      .bubble p:last-child {
        margin: 0;
      }
      .mind {
        margin: 12px 4px;
        background: #2a2140;
        color: #f4eefc;
        border-radius: 16px;
        padding: 10px 12px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .mind-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 8px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #d7c7f3;
      }
      .mind-mark {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--mind);
        display: grid;
        place-items: center;
        font-size: 12px;
        color: #fff;
      }
      .mind p {
        margin: 0 0 6px;
        font-size: 13px;
        line-height: 1.45;
      }
      .mind p:last-child {
        margin: 0;
      }
      footer {
        background: #eee;
        padding: 8px 10px 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      footer input {
        flex: 1;
        border: 0;
        background: #fff;
        border-radius: 18px;
        padding: 8px 12px;
        font: inherit;
      }
      footer button {
        border: 0;
        background: var(--line);
        color: #fff;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="note">
        <b>評審視角 · 提案進仲裁</b><br />
        白泡是 user agent 送給仲裁的一則提案。紫塊是仲裁心智，不是群組成員在聊天。乘客 App 看不到。
      </div>
      <header>
        <div class="back">‹</div>
        <div>
          <h1>PinDeal match room</h1>
          <p>4 user agents pitch · 1 arbiter mind</p>
        </div>
        <div></div>
      </header>
      <main class="thread"></main>
      <footer>
        <input disabled value="Riders cannot type here" />
        <button type="button" disabled>↑</button>
      </footer>
    </div>
    <script type="module" src="/src/judgeMain.ts"></script>
  </body>
</html>
